name: Generate Sponsors README
on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * *
jobs:
  preflight:
    name: Verify sponsor workflow token
    runs-on: ubuntu-latest
    outputs:
      sponsors_ready: ${{ steps.verify.outputs.sponsors_ready }}
    env:
      SPONSOR_WORKFLOW_PAT: ${{ secrets.SPONSOR_WORKFLOW_PAT }}
    steps:
      - id: verify
        shell: bash
        run: |
          if [ -n "$SPONSOR_WORKFLOW_PAT" ]; then
            echo 'sponsors_ready=true' >> "$GITHUB_OUTPUT"
            echo 'Sponsor workflow token is available.'
          else
            echo 'sponsors_ready=false' >> "$GITHUB_OUTPUT"
            echo 'Sponsor workflow skipped because SPONSOR_WORKFLOW_PAT is unavailable.'
          fi

  deploy:
    needs: preflight
    if: ${{ needs.preflight.outputs.sponsors_ready == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v2

      - name: Generate Sponsors 💖
        uses: JamesIves/github-sponsors-readme-action@v1.2.2
        with:
          token: ${{ secrets.SPONSOR_WORKFLOW_PAT }}
          file: 'README.md'
          minimum: 1399

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5.0.1
        with:
          token: ${{ secrets.SPONSOR_WORKFLOW_PAT }}
          branch: "workflow/sponsors"
          title: "🤖 Update Sponsors"
          commit-message: "🤖 Update Sponsors"
          body: "🤖 Automated pull request created by [sponsors action](https://github.com/reworkd/AgentGPT/actions/workflows/sponsors.yml)"
          labels: "documentation"

