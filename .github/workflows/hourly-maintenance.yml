name: Hourly Maintenance

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-maintenance-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      reworkd_platform-db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "reworkd_platform"
          MYSQL_DATABASE: "reworkd_platform"
          MYSQL_AUTHENTICATION_PLUGIN: "mysql_native_password"
        options: >-
          --health-cmd="mysqladmin ping -u root"
          --health-interval=15s
          --health-timeout=5s
          --health-retries=6
        ports:
          - 3306:3306
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - name: Read maintenance state
        id: state
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "hourly-maintenance.yml",
              per_page: 1,
            });
            core.setOutput("cycle", String(data.total_count));
      - uses: actions/setup-python@v5
        if: ${{ fromJSON(steps.state.outputs.cycle) <= 2400 }}
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        if: ${{ fromJSON(steps.state.outputs.cycle) <= 2400 }}
        run: |
          pipx install poetry
          poetry install
      - name: Run bounded platform validation
        id: validation
        if: ${{ fromJSON(steps.state.outputs.cycle) <= 2400 }}
        continue-on-error: true
        env:
          REWORKD_PLATFORM_HOST: "0.0.0.0"
          REWORKD_PLATFORM_DB_HOST: localhost
          REWORKD_PLATFORM_KAFKA_BOOTSTRAP_SERVERS: '["localhost:9092"]'
        run: |
          poetry run black --check .
          poetry run mypy .
          poetry run pytest -vv --cov="reworkd_platform" .
      - name: Record maintenance summary
        if: ${{ always() }}
        env:
          CYCLE: ${{ steps.state.outputs.cycle }}
          RESULT: ${{ steps.validation.outcome || 'skipped' }}
        run: |
          echo "## Hourly maintenance" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cycle count: $CYCLE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validation outcome: ${RESULT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- State source: GitHub Actions workflow-run history" >> "$GITHUB_STEP_SUMMARY"
          echo "- Safety: no pull-request merge, source modification, credential storage, or issue creation" >> "$GITHUB_STEP_SUMMARY"
